<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="msapplication-tap-highlight" content="no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="忍者：无尽试炼">
<meta name="application-name" content="忍者：无尽试炼">
<meta name="theme-color" content="#0f1d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<title>忍者：无尽试炼 · Ninja Survivors</title>
<link rel="stylesheet" href="css/style.css?v=home57"><link rel="stylesheet" href="css/current-ui.css?v=home57"><link rel="stylesheet" href="css/roster.css?v=home57">
<link rel="stylesheet" href="css/home-lobby.css?v=home57">
</head>
<body>
<div id="app">
  <!-- One focused loading screen. Enter is enabled only after assets finish preparing. -->
  <div id="title-screen" class="screen" data-ready="false" aria-busy="true">
    <div class="title-bg" aria-hidden="true"></div>
    <section class="entry-stack" aria-label="忍者：无尽试炼加载">
      <div class="title-logo"><h1 class="logo-main">忍者：<span>无尽试炼</span></h1><div class="logo-sub">NINJA · ENDLESS TRIALS</div></div>
      <div class="entry-loader"><div class="entry-loader-status"><span id="entry-progress" role="status" aria-live="polite">正在准备素材…</span><span id="entry-percent">0%</span></div><div id="entry-meter" class="entry-meter" role="progressbar" aria-label="素材加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="entry-fill"></i></div></div>
      <button id="entry-enter" class="title-tap" type="button" disabled>正在加载素材…</button>
      <button id="entry-retry" class="pbtn" type="button" hidden>重新加载</button>
      <p class="title-note">同人非官方 · 像素忍者生存试炼</p>
    </section>
  </div>

  <!-- 局外界面（二次元手游风格） -->
  <div id="ui" class="screen hidden">
    <div id="topbar"></div>
    <div id="ui-main"></div>
    <nav id="bottom-nav"></nav>
  </div>

  <!-- The preserved game creates #battle-frame here; the legacy v0.1 HUD is not used. -->
  <div id="battle" class="screen hidden"><div id="result" class="overlay no-joy hidden"></div></div>

  <div id="gacha-anim" class="overlay hidden"></div>
  <div id="modal" class="overlay hidden"></div>
  <div id="toast-layer"></div>
</div>

<script src="src/battle-bridge.js?v=home57"></script>
<script src="src/data/portrait-layout.js?v=home57"></script><script src="src/roster-ui.js?v=home57"></script>
<script src="src/home-portrait.js?v=home57"></script>
<script src="src/home-lobby.js?v=home57"></script>
<script src="src/ui.js?v=home57"></script>
<script src="src/mobile.js?v=home57"></script>
<script src="src/main.js?v=home57"></script>
</body>
</html>
